# فروشیار — کانفیگ موقت برای گرفتن گواهی (قبل از فعال‌سازی TLS)
#
# چرا لازم است: کانفیگ اصلی به
#   /etc/letsencrypt/live/example.com/fullchain.pem
# اشاره می‌کند و تا وقتی این فایل وجود نداشته باشد، `nginx -t` شکست می‌خورد و
# Nginx حتی برای گرفتن همان گواهی بالا نمی‌آید. (مرغ و تخم‌مرغ)
#
# ترتیب درست:
#   1) DNS: رکورد A دامنه → IP سرور (قبل از هر چیز؛ certbot به آن نیاز دارد)
#   2) این فایل را موقتاً فعال کن:  sites-enabled/forooshyar
#   3) sudo certbot certonly --webroot -w /var/www/certbot -d example.com -d www.example.com
#   4) کانفیگ اصلی (forooshyar.conf) را جای این بگذار و reload کن
#
# مسیر پیشنهادی: /etc/nginx/sites-available/forooshyar

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← دامنه‌ی خودت

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
