# هدرهای امنیتی — به‌صورت include در هر جا که add_header داریم تکرار می‌شود.
#
# چرا جدا شده: در nginx، اگر یک location خودش حتی یک add_header داشته باشد،
# **همه‌ی** add_headerهای سطح بالاتر نادیده گرفته می‌شوند (ارث‌بری all-or-nothing).
# بدون این include، صفحه‌ی اصلی پنل (`location /`) هدرهای HSTS و X-Frame و … را
# از دست می‌داد — این را در تست واقعی همین کیت دیدیم.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
