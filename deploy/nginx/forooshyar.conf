# فروشیار — Nginx
# مسیر پیشنهادی: /etc/nginx/sites-available/forooshyar
# سپس: ln -s /etc/nginx/sites-available/forooshyar /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# فرض: دامنه برای پنل + API همان یکی است. Next روی 127.0.0.1:3000 و Nest روی
# 127.0.0.1:3001 گوش می‌دهند و از بیرون قابل دسترسی نیستند.

# محدودیت نرخ روی مسیرهای ورود/ثبت‌نام (لایه‌ی دوم؛ خود API هم Throttler دارد)
limit_req_zone $binary_remote_addr zone=forooshyar_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=forooshyar_api:10m rate=120r/m;

upstream forooshyar_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream forooshyar_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ------------------------------------------------------------------ HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← دامنه‌ی خودت

    # چالش ACME را باز بگذار، بقیه را به HTTPS بفرست
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------ HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;   # ← دامنه‌ی خودت

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ------------------------------------------------------------ security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # ---------------------------------------------------------------- uploads/body
    # فایل CSV/XLSX حداکثر ۲ مگابایت است (سقف multer)؛ کمی بالاتر می‌گذاریم.
    client_max_body_size 4m;
    client_body_timeout 30s;

    # ------------------------------------------------------------------- compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;
    gzip_vary on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------------------------------------------------------- login / auth
    # مسیر از سمت پنل: /api/auth/* → API
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=forooshyar_auth burst=5 nodelay;
        proxy_pass http://forooshyar_api;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 20s;
    }

    # ------------------------------------------------------------------------ API
    # پنل، /api/* را در همان مبدأ صدا می‌زند و خودش به Nest پروکسی می‌کند.
    # این لوکیشن برای این است که اگر خواستی مستقیم هم قابل صدا زدن باشد.
    location /api/ {
        limit_req zone=forooshyar_api burst=60 nodelay;
        proxy_pass http://forooshyar_api/;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------- Next assets
    # فایل‌های build شده Next نام هش‌دار دارند → کش طولانی
    location /_next/static/ {
        proxy_pass http://forooshyar_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        proxy_pass http://forooshyar_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------------------------------------------------------- everything else
    location / {
        proxy_pass http://forooshyar_web;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        # صفحه‌های پنل داده‌ی فروشگاه‌اند: هیچ‌جا کش عمومی نشوند
        add_header Cache-Control "no-store" always;
    }

    # سلامتی برای load balancer / uptime monitor
    location = /healthz {
        access_log off;
        proxy_pass http://forooshyar_api/health;
    }

    access_log /var/log/nginx/forooshyar.access.log;
    error_log  /var/log/nginx/forooshyar.error.log warn;
}
