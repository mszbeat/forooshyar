# فروشیار — Nginx
# مسیر پیشنهادی: /etc/nginx/sites-available/forooshyar
# سپس: ln -s /etc/nginx/sites-available/forooshyar /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
#
# فرض: دامنه برای پنل + API همان یکی است. Next روی 127.0.0.1:3000 و Nest روی
# 127.0.0.1:3001 گوش می‌دهند و از بیرون قابل دسترسی نیستند.
#
# **قبل از nginx -t این را هم کپی کن، وگرنه include پیدا نمی‌شود:**
#   sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/forooshyar-security-headers.conf
#
# برای گرفتن گواهی، اول forooshyar-bootstrap.conf را فعال کن (توضیح در docs/DEPLOY.md).

# محدودیت نرخ روی مسیرهای ورود/ثبت‌نام (لایه‌ی دوم؛ خود API هم Throttler دارد)
limit_req_zone $binary_remote_addr zone=forooshyar_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=forooshyar_api:10m rate=120r/m;

# پیش‌فرض nginx برای عبور از محدودیت، 503 برمی‌گرداند؛ این برای پنل یعنی
# «سرور خراب است» و مانیتورینگ هم آن را outage می‌شمارد. 429 درست است.
limit_req_status 429;

upstream forooshyar_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream forooshyar_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ------------------------------------------------------------------ HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;   # ← دامنه‌ی خودت

    # چالش ACME را باز بگذار، بقیه را به HTTPS بفرست
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------ HTTPS
server {
    # نکته‌ی نسخه: nginx در Ubuntu 22.04 نسخه‌ی 1.18 و در 24.04 نسخه‌ی 1.24 است
    # و دستور `http2 on;` فقط از 1.25.1 به بعد وجود دارد. پارامتر `http2` روی
    # listen همه‌جا کار می‌کند (روی نسخه‌های جدید فقط یک warning می‌دهد).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;   # ← دامنه‌ی خودت

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ------------------------------------------------------------ security headers
    # در هر location‌ای که add_header دارد، این فایل هم include می‌شود؛
    # چون add_header ارث‌بری all-or-nothing دارد.
    include /etc/nginx/snippets/forooshyar-security-headers.conf;
    server_tokens off;

    # ---------------------------------------------------------------- uploads/body
    # فایل CSV/XLSX حداکثر ۲ مگابایت است (سقف multer)؛ کمی بالاتر می‌گذاریم.
    client_max_body_size 4m;
    client_body_timeout 30s;

    # ------------------------------------------------------------------- compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    # woff2 خودش فشرده است؛ دوباره gzip کردنش فقط CPU می‌سوزاند.
    gzip_vary on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---------------------------------------------------------------- login / auth
    # مسیر از سمت پنل: /api/auth/* → API
    # مهم: API پیشوند /api ندارد (مسیرها /auth/login و /auth/register هستند)،
    # پس باید پیشوند /api حذف شود وگرنه nginx همان /api/auth/login را فوروارد
    # می‌کند و API 404 می‌دهد.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=forooshyar_auth burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://forooshyar_api;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 20s;
    }

    # ------------------------------------------------------------------------ API
    # پنل، /api/* را در همان مبدأ صدا می‌زند و خودش به Nest پروکسی می‌کند.
    # این لوکیشن برای این است که اگر خواستی مستقیم هم قابل صدا زدن باشد.
    location /api/ {
        limit_req zone=forooshyar_api burst=60 nodelay;
        proxy_pass http://forooshyar_api/;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------- Next assets
    # فایل‌های build شده Next نام هش‌دار دارند → کش طولانی
    location /_next/static/ {
        proxy_pass http://forooshyar_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/forooshyar-security-headers.conf;
    }

    location /fonts/ {
        proxy_pass http://forooshyar_web;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/forooshyar-security-headers.conf;
    }

    # ---------------------------------------------------------------- everything else
    location / {
        proxy_pass http://forooshyar_web;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        # صفحه‌های پنل داده‌ی فروشگاه‌اند: هیچ‌جا کش عمومی نشوند.
        # هدر خود Next حذف می‌شود تا دو مقدار متناقض با هم نروند.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/forooshyar-security-headers.conf;
    }

    # سلامتی برای load balancer / uptime monitor
    location = /healthz {
        access_log off;
        proxy_pass http://forooshyar_api/health;
    }

    # ------------------------------------------------------- پاسخ JSON برای ۴۲۹
    # nginx به‌طور پیش‌فرض HTML برمی‌گرداند و پنل نمی‌تواند آن را parse کند.
    # بدنه‌ی خود API هم همین شکل را دارد تا رفتار یکدست باشد.
    error_page 429 = @forooshyar_too_many;
    location @forooshyar_too_many {
        default_type application/json;
        add_header Retry-After 60 always;
        include /etc/nginx/snippets/forooshyar-security-headers.conf;
        return 429 '{"statusCode":429,"message":"درخواست‌های زیادی از این آی‌پی ارسال شده است؛ یک دقیقه بعد دوباره تلاش کنید.","requestId":"$request_id","path":"$uri"}';
    }

    access_log /var/log/nginx/forooshyar.access.log;
    error_log  /var/log/nginx/forooshyar.error.log warn;
}
