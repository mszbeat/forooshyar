services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forooshyar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forooshyar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forooshyar -d forooshyar"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
    command: sh -c "npm ci && npm run dev:api"
    environment:
      DATABASE_URL: postgresql://forooshyar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/forooshyar?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3001
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:3001:3001"]
  web:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - web_dependencies:/workspace/node_modules
    command: sh -c "npm ci && npm run dev:web"
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres_data:
  dependencies:
  web_dependencies:
